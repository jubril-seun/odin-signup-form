<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Sign Up Form</title>
</head>
<body>
    <main>
        <!-- <div class="image-container"> -->
            <!-- <img src="imgs/masantocreative-R_ZZZJ56eJM-unsplash.jpg" class="hero-img" alt="Hero Image"> -->
        </div>
            <div class="form-container">
                <div class="header">
                    <p>Welcome to Arcadia</p>
                    <p>Get instant access to the most popular games and new titles on release.</p>
                    <p>No waiting. No compromises.</p>
    
                </div>
                <form id="signup">
                    <div>
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>
                    <div>
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                    <div class="email-row">
                        <label for="user-email">Email Address</label>
                        <input type="email" id="user-email" name="email" required>
                    </div>
                    <div>
                        <label for="user-password">Password</label>
                        <input type="password" id="user-password" name="password" required>
                    </div>
                    <div>
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="password" required>
                    </div>
                </form>
            </div>

            <button type="submit" form="signup">Create Account</button>
    </main>
</body>
</html>
